{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-body">

                <h2 class="mb-4 text-center">
                    Upload Chest X-Ray
                </h2>

                <form method="POST" enctype="multipart/form-data">

                    <div class="mb-3">

                        <input
                            type="file"
                            name="image"
                            class="form-control"
                            accept="image/*"
                            required
                        >

                    </div>

                    <button class="btn btn-success w-100">
                        Predict
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
