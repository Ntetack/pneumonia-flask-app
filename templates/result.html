{% extends 'base.html' %}

{% block content %}

<div class="card shadow">

<div class="card-body text-center">

<h2 class="mb-4">
Prediction Result
</h2>

<img
src="{{ url_for('static', filename='uploads/' + filename) }}"
class="img-fluid rounded mb-4"
width="400">

<h3>
Result :
<span class="text-primary">
{{ result }}
</span>
</h3>

<h4 class="mt-3">
Confidence :
{{ confidence }}%
</h4>

<a
href="{{ url_for('dashboard') }}"
class="btn btn-dark mt-4">
Try Again
</a>

</div>

</div>

{% endblock %}
